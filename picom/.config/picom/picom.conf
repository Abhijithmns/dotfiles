##################################
#             Shadows           #
#################################

# Enable window shadows (cheap compared to blur)
shadow = true;

# Reduced shadow size to limit redraw cost
shadow-radius = 5;
shadow-offset-x = -5;
shadow-offset-y = -5;


#################################
#           Fading              #
#################################

# Disabled fading to avoid continuous redraw loops
fading = false;


#################################
#   Transparency / Opacity      #
#################################

# Slight opacity for borders/titlebars
frame-opacity = 0.9;


#################################
#           Corners             #
#################################

# No rounded corners
corner-radius = 0;


#################################
#            Blur               #
#################################

# Enable blur engine
# dual_kawase gives decent quality with minimal settings
blur-method = "dual_kawase";

# VERY SMALL blur to avoid GPU overheating
blur-size = 5;
blur-strength = 1;

# Disable global blur
# Blur will be enabled only via rules
blur-background = false;


#################################
#       General Settings        #
#################################

# Use OpenGL backend (best balance for dwm)
backend = "glx";

# Enable vsync to avoid tearing
vsync = true;

# Disable rounded-corner detection (unused, wastes CPU)
detect-rounded-corners = false;

# Detect client-set opacity (needed for terminal transparency)
detect-client-opacity = true;

# Only redraw changed screen regions (important for power saving)
use-damage = true;

# Correct handling of transient windows
detect-transient = true;


#################################
#       Window Rules            #
#################################

rules: ({
  # Enable blur ONLY for terminal windows
  # Adjust class names if needed (check with xprop)
  match = "class_g = 'Alacritty' || "
          "class_g = 'st'        || "
          "class_g = 'kitty'";
  blur-background = true;
}, {
  # Tooltips: allow shadow, no blur
  match = "window_type = 'tooltip'";
  shadow = true;
  fade = false;
  opacity = 0.75;
}, {
  # Disable blur for docks and desktop windows
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  blur-background = false;
  shadow = false;
}, {
  # Disable shadows on notifications and special windows
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock'";
  shadow = false;
})
################################


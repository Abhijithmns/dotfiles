##### reload config #####
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### prefix #####
set -g prefix C-s
unbind C-b
bind C-s send-prefix

##### basics #####
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000

# Linux only
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind-key -r z run-shell "tmux new-window 'nohup zathura $(fzf)'"


# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

##### vim-style pane navigation #####
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

##### vim escape delay fix #####
set -s escape-time 0

##### status bar (SOLID & MINIMAL) #####
set -g status on
set -g status-position top
set -g status-interval 5

# solid but neutral bar (plays nice with pywal)
set -g status-style "bg=colour0,fg=colour7"

# window list
setw -g window-status-format " #[fg=colour7]#I:#W "
setw -g window-status-current-format " #[bold,fg=colour15]#I:#W "

# left / right
set -g status-left ""
set -g status-right " #[fg=colour7]%H:%M "

##### pane borders #####
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour12"

##### messages #####
set -g message-style "bg=colour0,fg=colour15"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
